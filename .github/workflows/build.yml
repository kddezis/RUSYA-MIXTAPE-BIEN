  - name: Configure
        working-directory: RusyaMixtape
        run: cmake -B build -A x64
      - name: Build
        working-directory: RusyaMixtape
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RUSYA-MIXTAPE-MAMAGUEVO-VST3
          path: RusyaMixtape/build/RusyaMixtape_artefacts/Release/VST3/
